<!doctype html>
<!-- SIGF overlay (NUI): captions, full-screen images, sounds, the guest library's HUD (guest.js, if the mod uses one), the mod's html/mod.js. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bebas+Neue&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="guest.css">
<link rel="stylesheet" href="../../html/mod.css">
</head>
<body>
<div id="overlay"></div>
<div id="captions"></div>
<div id="guest" class="hidden"></div>
<div id="mod"></div>
<script>
/* hud.js */
// SIGF overlay: messages from the bricks (SendNUIMessage) -> captions, overlay image, sounds, music, mod events.
const sounds = new Map();
let music = null;
const handlers = {
  text(m) {
    const el = document.createElement('div');
    el.className = 'caption' + (m.font === 'body' ? ' body' : '');
    el.textContent = m.text;
    el.style.top = ((m.y ?? 0.2) * 100) + 'vh';
    el.style.fontSize = (m.size ?? 64) + 'px';
    el.style.color = m.color ?? '#fff';
    // Same height = replace the previous caption there.
    for (const old of document.querySelectorAll('#captions .caption')) if (old.style.top === el.style.top) old.remove();
    document.getElementById('captions').appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); }, (m.sec ?? 3) * 1000);
  },
  overlay(m) {
    const el = document.getElementById('overlay');
    el.style.transition = 'none';
    el.style.backgroundImage = `url(../../${m.src})`;
    el.style.opacity = m.opacity ?? 0.85;
    setTimeout(() => { el.style.transition = `opacity ${m.fade ?? 0.6}s`; el.style.opacity = 0; }, (m.sec ?? 1.5) * 1000);
  },
  sound(m) {
    const a = new Audio(`../../${m.src}`);
    a.volume = Math.max(0, Math.min(1, m.volume ?? 1));
    a.loop = !!m.loop;
    if (m.rate) { a.preservesPitch = false; a.playbackRate = m.rate; }
    a.play().catch(() => {});
    sounds.set(m.id, a);
    a.onended = () => sounds.delete(m.id);
  },
  stopsound(m) { const a = sounds.get(m.id); if (a) { a.pause(); sounds.delete(m.id); } },
  music(m) {
    if (music) { music.pause(); music = null; }
    if (!m.src) return;
    music = new Audio(`../../${m.src}`);
    music.loop = true;
    music.volume = m.volume ?? 0.5;
    music.play().catch(() => {});
  },
  mod(m) { window.dispatchEvent(new CustomEvent('sigfmod', { detail: m.data })); },
};
window.sigfHandlers = handlers;   // guest.js adds its own
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || !m.t) return;
  const h = handlers[m.t];
  if (h) try { h(m); } catch (err) { console.error('sigf hud', m.t, err); }
});

</script>
<script src="guest.js"></script>
<script>
/* ../../html/mod.js */
const root = document.getElementById('mod');
root.innerHTML = `
<div id="hk-top">
  <div class="hk-team hk-a"><span class="hk-name">DAWN</span><span id="hk-sa" class="hk-score">0</span></div>
  <div id="hk-time">0:00</div>
  <div class="hk-team hk-b"><span id="hk-sb" class="hk-score">0</span><span class="hk-name">DUSK</span></div>
</div>
<div id="hk-boss"><div id="hk-boss-label">THE TYRANT</div><div id="hk-boss-bar"><div id="hk-boss-fill"></div></div></div>
<div id="hk-me"><img src="../../img/crown.png"><div><div id="hk-lv">Lv 1</div><div id="hk-gold"><img src="../../img/coin.png"> <span id="hk-gv">500</span></div></div></div>
<div id="hk-feed"></div>`;
const $ = (id) => document.getElementById(id);
window.addEventListener('sigfmod', (e) => {
  const d = e.detail;
  if (d.a !== undefined) $('hk-sa').textContent = d.a;
  if (d.b !== undefined) $('hk-sb').textContent = d.b;
  if (d.time !== undefined) $('hk-time').textContent = Math.floor(d.time / 60) + ':' + String(d.time % 60).padStart(2, '0');
  if (d.gold !== undefined) $('hk-gv').textContent = d.gold;
  if (d.level !== undefined) $('hk-lv').textContent = 'Lv ' + d.level;
  if (d.boss !== undefined) {
    $('hk-boss').style.display = d.boss >= 0 ? 'block' : 'none';
    $('hk-boss-fill').style.width = Math.max(0, d.boss * 100) + '%';
  }
  if (d.feed) {
    const row = document.createElement('div');
    row.className = 'hk-row';
    row.style.borderLeftColor = d.feedColor || '#ffd34d';
    row.textContent = d.feed;
    $('hk-feed').appendChild(row);
    while ($('hk-feed').children.length > 5) $('hk-feed').removeChild($('hk-feed').firstChild);
    setTimeout(() => row.remove(), 6000);
  }
});

</script>
</body>
</html>
